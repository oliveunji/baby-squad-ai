name: Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]

env:
  REGION: asia-northeast3
  REPO_NAME: baby-repo
  IMAGE_NAME: babysquad

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # 1. 구글 클라우드 인증
    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v1'
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    # 2. Docker 인증 및 gcloud 설정
    - name: Setup Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Configure Docker
      run: gcloud auth configure-docker asia-northeast3-docker.pkg.dev

    # 3. 이미지 빌드 및 업로드 (Backend & Frontend 공용)
    - name: Build and Push Docker Image
      run: |
        IMAGE_URI=asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        docker build --platform linux/amd64 -t $IMAGE_URI .
        docker push $IMAGE_URI

    # 4. 백엔드 배포 (🆕 LangSmith 환경변수 추가!)
    - name: Deploy Backend
      run: |
        gcloud run deploy babysquad-backend \
          --image asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --region ${{ env.REGION }} \
          --port 8000 \
          --memory 2Gi \
          --timeout 300 \
          --allow-unauthenticated \
          --set-env-vars "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }},LANGCHAIN_TRACING_V2=true,LANGCHAIN_PROJECT=baby-squad-agent,GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }},PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}"

    # 5. 프론트엔드 배포
    - name: Deploy Frontend
      run: |
        gcloud run deploy babysquad-frontend \
          --image asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --region ${{ env.REGION }} \
          --port 8501 \
          --memory 2Gi \
          --allow-unauthenticated \
          --command streamlit \
          --args run,app.py,--server.port=8501,--server.address=0.0.0.0 \
          --set-env-vars "BACKEND_URL=${{ secrets.BACKEND_URL }}"